# Traefik for a production server: HTTP on :80 redirects to HTTPS on :443,
# with Let's Encrypt certificates from the "le" resolver. It routes to Swarm
# services on the echowa-public network that set traefik.enable=true, and
# to the routes in /etc/echowa/traefik: Echowa's own UI, when it's served
# over HTTPS on port 8192 (ADR 0022, with traefik-ui.yml).
#
# `echowa setup` deploys it as the stack "traefik", and redeploys it when a
# release changes it. Let's Encrypt accounts need no contact email, so none
# is set.

services:
  traefik:
    image: traefik:v3.7.16
    command:
      - --providers.swarm.endpoint=unix:///var/run/docker.sock
      - --providers.swarm.exposedByDefault=false
      - --providers.swarm.network=echowa-public
      - --providers.swarm.refreshSeconds=5
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true

      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      # The redirect is a catch-all router. Priority 1 lets a router that is
      # explicitly on "web" (an app with TLS off) win over it, and Traefik's
      # ACME challenge router always wins.
      - --entrypoints.web.http.redirections.entrypoint.priority=1
      - --entrypoints.websecure.address=:443
      # Echowa's UI with HTTPS access, never apps. traefik-ui.yml publishes
      # it only on servers that use it.
      - --entrypoints.echowa.address=:8192

      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web

      # No --api: the API and dashboard stay off. Ping answers the
      # healthcheck on the internal "traefik" entrypoint (:8080), which isn't
      # published.
      - --ping=true
      - --log.level=INFO
      - --global.checkNewVersion=false
      - --global.sendAnonymousUsage=false
    ports:
      # Host mode, so apps see the real client IP. Swarm's ingress mesh
      # would rewrite it.
      - target: 80
        published: 80
        protocol: tcp
        mode: host
      - target: 443
        published: 443
        protocol: tcp
        mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
      - /etc/echowa/traefik:/etc/traefik/dynamic:ro
    networks:
      - echowa-public
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      replicas: 1
      placement:
        constraints:
          # The Swarm provider reads services from the manager's API.
          - node.role == manager
      update_config:
        # Host-mode ports can't be bound by two tasks at once, so an update
        # stops the old task first: a few seconds without the proxy.
        order: stop-first
        failure_action: rollback
      restart_policy:
        condition: any

networks:
  echowa-public:
    external: true

volumes:
  letsencrypt:
