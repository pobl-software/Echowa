<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <title inertia>Echowa</title>
        <meta name="color-scheme" content="light dark">
        <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 256 256'%3E%3CclipPath id='c'%3E%3Crect width='256' height='256' rx='50'/%3E%3C/clipPath%3E%3Cg clip-path='url(%23c)'%3E%3Crect width='256' height='256' fill='%23090909'/%3E%3Cpath fill='%23D14400' d='M217.635 131.275L112.492 236.417L78.1111 202.036L132.881 147.266L138.078 160.059H-68.6089V102.49H138.078L132.881 115.283L78.1111 60.5131L112.492 26.1319L217.635 131.275Z'/%3E%3C/g%3E%3C/svg%3E" />
        <script>
            // Apply the saved theme before first paint (resources/js/lib/theme.ts).
            try {
                var theme = localStorage.getItem('echowa-theme');
                if (theme === 'dark' || (theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                    document.documentElement.classList.add('dark');
                }
            } catch (e) {}
        </script>

        {{ .vite }}
        {{ .inertiaHead }}
    </head>
    <body class="antialiased">
        {{ .inertia }}
    </body>
</html>
