<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <title inertia>Echowa</title>
        <meta name="color-scheme" content="light dark">
        <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 96 96'%3E%3Crect width='96' height='96' rx='22' fill='%23D14400'/%3E%3Cpath fill='%23fff' transform='translate(16 11.6) scale(0.8)' d='M79.8615 45.5077L50.5269 74.8423L40.9346 65.25L56.2154 49.9692L57.6654 53.5384H0V37.4769H57.6654L56.2154 41.0461L40.9346 25.7653L50.5269 16.173L79.8615 45.5077Z'/%3E%3C/svg%3E">
        <script>
            // Apply the saved theme before first paint (resources/js/lib/theme.ts).
            try {
                var theme = localStorage.getItem('echowa-theme');
                if (theme === 'dark' || (theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                    document.documentElement.classList.add('dark');
                }
            } catch (e) {}
        </script>

        {{ .vite }}
        {{ .inertiaHead }}
    </head>
    <body class="antialiased">
        {{ .inertia }}
    </body>
</html>
